# Publish a GitHub Release for a version tag (vX.Y.Z matching kangedit.__version__): test, build every
# platform, then attach the archives and their SHA-256 checksums, with the version's CHANGELOG.md section as
# the release notes. Runs when a tag is pushed, or from the "Bump version" workflow.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - id: check
        name: Tag matches kangedit.__version__
        run: echo "version=$(python scripts/bump_version.py --check "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v5
        with:
          pattern: KangEdit-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum KangEdit-* | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/changelog.py "$VERSION" | tee "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The CHANGELOG section comes first; GitHub's generated notes (merged PRs, contributors) follow it.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "KangEdit $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
