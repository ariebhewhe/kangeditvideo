# Packaged builds for Windows, macOS (Apple Silicon) and Linux, uploaded as workflow artifacts.
# Only started by hand (Actions → Build → Run workflow): releases don't build automatically.
name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build (default: the selected branch)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-22.04        # oldest supported glibc, so the build runs on more distributions
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - name: Build, self-test and archive
        run: python scripts/build.py
      - uses: actions/upload-artifact@v5
        with:
          name: KangEdit-${{ matrix.platform }}
          path: |
            dist/KangEdit-*.zip
            dist/KangEdit-*.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0     # already compressed
